[project]
name = "robots-ai-permissions"
version = "0.0.0"
description = "Analyze AI permissions on websites via robots.txt, ai.txt, llms.txt, and llms-full.txt files."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
dependencies = [
    "altair>=5.5.0",
    "boto3>=1.40.27",
    "dotenv>=0.9.9",
    "fire>=0.7.1",
    "polars>=1.34.0",
    "proxy-py>=2.4.10",
    "publicsuffix2>=2.20191221",
    "pyarrow>=17.0.0",
    "rapidfuzz>=3.14.1",
    "requests>=2.32.5",
    "tldextract>=5.3.0",
    "tqdm>=4.67.1",
    "upsetplot>=0.9.0",
    "vegafusion[embed]>=1.5.0",
    "vl-convert-python>=1.7.0",
]

[dependency-groups]
dev = [
    "beautifulsoup4>=4.12.0",
    "clickhouse-connect>=0.8.0",
    "fastwarc>=0.15.0",
    "jupyter>=1.1.1",
    "pre-commit>=4.3.0",
    "ruff>=0.14.0",
]

[tool.ruff]
# Find rules on https://beta.ruff.rs/docs/rules/
line-length = 120

[tool.ruff.lint]
ignore = ["SIM115", "E501", "D100"]

[tool.ruff.lint.per-file-ignores]
"src/crawler/fetch_url_lists.py" = ["ANN001", "ANN201"]
"src/notebooks/*.ipynb" = ["ANN001", "ANN201", "ANN202"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
