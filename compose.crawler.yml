name: scraping

services:
  unbound:
    image: docker.io/mvance/unbound:latest
    ports:
      - "5335:53/tcp"
      - "5335:53/udp"
    volumes:
      - ./container/unbound.conf:/etc/unbound/unbound.conf:ro,z
      - ./logs/unbound:/var/log/unbound:z
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    networks:
      scraping:
        ipv4_address: 172.25.0.10
  crawler:
    build:
      context: ./
      dockerfile: container/Containerfile.crawler
    command:
      [
        "uv",
        "run",
        "python",
        "src/crawler/download_splits.py",
        "--date",
        "2025-10-11",
      ]
    volumes:
      - ./data:/app/data:z
      - ./logs/crawler:/app/logs:z
      - /etc/localtime:/etc/localtime:ro
    restart: "no"
    depends_on:
      - unbound
    dns:
      - 172.25.0.10
    networks:
      scraping:
        ipv4_address: 172.25.0.20

networks:
  scraping:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/24
          gateway: 172.25.0.1
