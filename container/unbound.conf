server:
    # Basic settings
    directory: "/opt/unbound/etc/unbound"
    username: "_unbound"
    do-ip4: yes
    do-ip6: no
    do-tcp: yes
    do-udp: yes

    # Interface and access
    interface: 0.0.0.0@53
    port: 53
    access-control: 0.0.0.0/0 allow  # Adjust based on your network

    # Performance for scraping
    num-threads: 8
    msg-cache-size: 256m
    rrset-cache-size: 512m
    cache-min-ttl: 300
    cache-max-ttl: 86400
    num-queries-per-thread: 8192
    outgoing-range: 16384
    incoming-num-tcp: 100
    so-reuseport: yes

    # Disable daemon mode for container
    do-daemonize: no

    # Basic security
    hide-identity: yes
    hide-version: yes

    # Logging
    verbosity: 1
    logfile: "/var/log/unbound.log"

remote-control:
    control-enable: no
